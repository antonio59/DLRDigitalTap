packages:
  - .

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# pnpm applies these; top-level package.json "overrides" is npm-only.
# Keep majors that already exist in the tree (do not force 1.x -> 5.x).
overrides:
  postcss: ^8.5.26
  nanoid@3: 3.3.18
  js-yaml: ^4.3.2
  brace-expansion@1: 1.1.18
  brace-expansion@5: 5.0.9
  ws@8: 8.21.3
